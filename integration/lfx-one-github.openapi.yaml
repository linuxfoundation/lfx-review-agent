# Operations the LFX review agent performs as `lfx-one`; tools are
# `lfx_one_github_<operation id>`. Never pin 1.0.6: Guild's generator
# stopped at its path-pinned issues_remove_label and dropped every later
# operation. Guild does not enforce request enums.

openapi: 3.0.3
info:
  title: LFX One GitHub
  version: 1.0.8
  description: GitHub REST operations the LFX review agent performs as lfx-one.
servers:
  - url: https://api.github.com

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Fine-grained token for the lfx-one account.
  parameters:
    owner:
      name: owner
      in: path
      required: true
      schema: { type: string }
    repo:
      name: repo
      in: path
      required: true
      schema: { type: string }
    pull_number:
      name: pull_number
      in: path
      required: true
      schema: { type: integer }
    issue_number:
      name: issue_number
      in: path
      required: true
      schema: { type: integer }
    comment_id:
      name: comment_id
      in: path
      required: true
      schema: { type: integer }
    review_id:
      name: review_id
      in: path
      required: true
      schema: { type: integer }
    per_page:
      name: per_page
      in: query
      schema: { type: integer, maximum: 100 }
    page:
      name: page
      in: query
      schema: { type: integer }
  responses:
    Ok:
      description: Successful response
      content:
        application/json:
          schema: { type: object }
    OkList:
      description: Successful response, a JSON array
      content:
        application/json:
          schema: { type: array, items: { type: object } }

paths:
  /repos/{owner}/{repo}/pulls/{pull_number}:
    get:
      operationId: pulls_get
      summary: Get a pull request
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/pull_number"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/pulls/{pull_number}/files:
    get:
      operationId: pulls_list_files
      summary: List files changed in a pull request
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/pull_number"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/OkList" }
  /repos/{owner}/{repo}/pulls/{pull_number}/commits:
    get:
      operationId: pulls_list_commits
      summary: List commits in a pull request
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/pull_number"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/OkList" }
  /repos/{owner}/{repo}/pulls/{pull_number}/reviews:
    get:
      operationId: pulls_list_reviews
      summary: List reviews on a pull request
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/pull_number"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/OkList" }
    post:
      operationId: pulls_create_review
      summary: Submit a review on a pull request
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/pull_number"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commit_id: { type: string }
                body: { type: string }
                event:
                  type: string
                  enum: [APPROVE, REQUEST_CHANGES, COMMENT]
                comments:
                  type: array
                  items: { type: object }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/pulls/{pull_number}/reviews/{review_id}:
    put:
      operationId: pulls_update_review
      summary: Update the body of a submitted review
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/pull_number"
        - $ref: "#/components/parameters/review_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/pulls/{pull_number}/comments:
    get:
      operationId: pulls_list_review_comments
      summary: List review comments on a pull request
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/pull_number"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/OkList" }
  /repos/{owner}/{repo}/issues/{issue_number}/comments:
    get:
      operationId: issues_list_comments
      summary: List conversation comments on an issue or pull request
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/issue_number"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/OkList" }
    post:
      operationId: issues_create_comment
      summary: Create a conversation comment
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/issue_number"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/issues/comments/{comment_id}:
    patch:
      operationId: issues_update_comment
      summary: Update a conversation comment
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/comment_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/issues/comments/{comment_id}/reactions:
    post:
      operationId: issues_create_reaction
      summary: React to a conversation comment
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/comment_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, enum: ["eyes"] }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "201": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/compare/{basehead}:
    get:
      operationId: repos_compare_commits
      summary: Compare two commits
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - name: basehead
          in: path
          required: true
          description: "<base>...<head>"
          schema: { type: string }
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/contents/{path}:
    get:
      operationId: repos_get_content
      summary: Get a file's contents
      description: Accept application/vnd.github.raw+json returns the file's text.
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - name: path
          in: path
          required: true
          schema: { type: string }
        - name: ref
          in: query
          schema: { type: string }
        - name: Accept
          in: header
          required: false
          schema: { type: string, enum: ["application/vnd.github.raw+json"] }
      responses:
        "200":
          description: JSON with base64 content, or the raw text
          content:
            application/json:
              schema: { type: object }
            application/vnd.github.raw+json:
              schema: { type: string }
  /repos/{owner}/{repo}/git/trees/{tree_sha}:
    get:
      operationId: git_get_tree
      summary: List one directory's entries with sizes
      description: tree_sha is "<commit>:<directory>", or a commit SHA for the root.
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - name: tree_sha
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/branches/{branch}:
    get:
      operationId: repos_get_branch
      summary: Get a branch, with its required status checks
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - name: branch
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/rules/branches/{branch}:
    get:
      operationId: repos_get_branch_rules
      summary: List the ruleset rules that apply to a branch
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - name: branch
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/OkList" }
  /repos/{owner}/{repo}/commits/{ref}/check-runs:
    get:
      operationId: checks_list_for_ref
      summary: List check runs with one name for a commit
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - name: ref
          in: path
          required: true
          schema: { type: string }
        - name: check_name
          in: query
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/commits/{ref}/status:
    get:
      operationId: repos_get_combined_status
      summary: Get the combined commit status for a commit
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - name: ref
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/issues/{issue_number}/labels:
    post:
      operationId: issues_add_labels
      summary: Add the pending label to an issue or pull request
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/issue_number"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labels]
              properties:
                labels:
                  type: array
                  items: { type: string, enum: ["lfx-review-agent-pending"] }
      responses:
        "200": { $ref: "#/components/responses/OkList" }
  /repos/{owner}/{repo}/issues/{issue_number}/labels/{name}:
    delete:
      operationId: issues_remove_label
      summary: Remove the pending label from an issue or pull request
      description: 404 when the label is not on the issue.
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/issue_number"
        - name: name
          in: path
          required: true
          schema: { type: string, enum: ["lfx-review-agent-pending"] }
      responses:
        "200": { $ref: "#/components/responses/OkList" }
        "404": { $ref: "#/components/responses/Ok" }
  /search/issues:
    get:
      operationId: search_issues
      summary: Search issues and pull requests
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [created, updated] }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /users/{username}:
    get:
      operationId: users_get_by_username
      summary: Get a user by login
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
