name: Agent Version Check

# Runs on every PR, without a paths filter, so it always reports a status
# and can be a required check. `edited` reruns it when the base changes.
"on":
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  agent-version-check:
    name: Agent Version Check
    runs-on: ubuntu-latest
    steps:
      - name: Require a version bump when PROMPT.md or guild.yaml changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # A separate assignment so a failed request stops the job. Renames
          # list the old path in previous_filename.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if ! grep -qxE 'PROMPT\.md|guild\.yaml' <<< "$files"; then
            echo "PROMPT.md and guild.yaml are unchanged; no bump needed."
            exit 0
          fi

          # Prints the x.y.z in the "Agent version" section, or nothing.
          # Fails when PROMPT.md can't be read.
          # shellcheck disable=SC2016 # the backticks are literal
          version() {
            local text
            text=$(gh api "repos/$1/contents/PROMPT.md?ref=$2" \
              -H "Accept: application/vnd.github.raw") || return 1
            sed -nE '/review agent version \*\*`[0-9]+\.[0-9]+\.[0-9]+`\*\*/{
              s/.*\*\*`([0-9]+\.[0-9]+\.[0-9]+)`\*\*.*/\1/p
              q
            }' <<< "$text"
          }
          base=$(version "$REPO" "$BASE_SHA") || {
            echo "::error::Could not read PROMPT.md at $BASE_SHA in $REPO."
            exit 1
          }
          head=$(version "$HEAD_REPO" "$HEAD_SHA") || {
            echo "::error::Could not read PROMPT.md at $HEAD_SHA in $HEAD_REPO."
            exit 1
          }
          next=$(echo "${base:-0.0.0}" | awk -F. '{print $1 "." $2 "." $3 + 1}')

          if [ -z "$head" ]; then
            echo "::error file=PROMPT.md::No x.y.z version found in the \"Agent version\" section. Set it to $next."
            exit 1
          fi
          if [ -n "$base" ] && { [ "$head" = "$base" ] ||
              [ "$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -n 1)" != "$head" ]; }; then
            echo "::error file=PROMPT.md::This PR changes PROMPT.md or guild.yaml but the agent version is $head (base $base). Bump it to $next."
            exit 1
          fi
          echo "Agent version ${base:-none} -> $head."
